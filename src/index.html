<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu La Đại Lục — Cửa hàng Plugin bản quyền & tài khoản</title>
<style>
:root{--bg:#0b1020;--card:#131a2e;--card2:#1a2240;--line:#2a3555;--tx:#e8ecf8;--mut:#93a0c2;--gold:#f0b642;--teal:#3ec9a7;--err:#e5484d;--warn:#f5a524;--blue:#5aa7ff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.55}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* topbar */
.topbar{background:#0d1226;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:800;font-size:1.05rem;color:var(--gold);letter-spacing:.3px;white-space:nowrap}
.brand small{color:var(--mut);font-weight:500}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:.85rem}
.userchip b{color:var(--teal)}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.tabs a{font-size:.85rem;padding:6px 11px;border-radius:8px;color:var(--mut);border:1px solid transparent}
.tabs a:hover{color:var(--tx);background:var(--card)}
.tabs a.on{color:var(--gold);border-color:var(--gold);background:#f0b64214}
.tabs a .bdg{display:inline-block;min-width:18px;text-align:center;background:var(--err);color:#fff;border-radius:10px;font-size:.72rem;padding:0 5px;margin-left:4px}
/* layout */
main.wrap{padding:18px 16px 60px;min-height:70vh}
h1.pagetitle{font-size:1.45rem;margin:6px 0 4px}
.subtitle{color:var(--mut);font-size:.92rem;margin-bottom:16px}
.tagchip{display:inline-block;background:#3ec9a722;color:var(--teal);border:1px solid #3ec9a755;font-size:.75rem;border-radius:14px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:1.02rem;margin-bottom:10px;color:var(--gold)}
.card h4{font-size:.95rem;margin:12px 0 8px;color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
/* buttons */
.btn{display:inline-block;border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.88rem;font-family:inherit}
.btn:hover{border-color:var(--mut)}
.btn-p{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:700}
.btn-p:hover{filter:brightness(1.08)}
.btn-d{background:#e5484d22;border-color:var(--err);color:#ff8589}
.btn-t{background:#3ec9a722;border-color:var(--teal);color:var(--teal)}
.btn-sm{padding:4px 10px;font-size:.8rem}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px}
.tbl th{background:var(--card2);color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid #20294a;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#ffffff08}
/* responsive bảng: máy tính bảng → chữ nhỏ hơn; điện thoại (<720px) → mỗi dòng = 1 thẻ dọc "nhãn: giá trị", không phải kéo ngang (30/11) */
@media (max-width:1080px){
  table.tbl{min-width:0;font-size:.8rem}
  .tbl th,.tbl td{padding:6px 7px}
}
@media (max-width:720px){
  .tbl-wrap{overflow-x:visible;border:0;background:none;border-radius:0}
  table.tbl{min-width:0;font-size:.78rem}
  table.tbl.tbl-cards{border:0;background:none;font-size:.85rem}
  table.tbl.tbl-cards thead{display:none}
  table.tbl.tbl-cards tbody{display:block}
  table.tbl.tbl-cards tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin:10px 0}
  table.tbl.tbl-cards td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:7px 0;text-align:right}
  table.tbl.tbl-cards td::before{content:attr(data-label);font-weight:600;color:var(--mut);text-align:left;flex:0 0 auto;white-space:nowrap}
  table.tbl.tbl-cards td[data-label=""]::before{display:none}
  table.tbl.tbl-cards td[colspan]{justify-content:center;text-align:center}
}
.code{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;background:#0d1226;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:.82rem;color:var(--teal)}
.codebox{font-family:ui-monospace,Consolas,monospace;background:#0d1226;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.82rem;white-space:pre-wrap;word-break:break-all;color:#bfe3ff}
/* badges */
.badge{display:inline-block;font-size:.74rem;font-weight:700;border-radius:12px;padding:2px 9px;white-space:nowrap}
.b-ok{background:#3ec9a725;color:var(--teal);border:1px solid #3ec9a766}
.b-warn{background:#f5a52422;color:var(--warn);border:1px solid #f5a52466}
.b-err{background:#e5484d25;color:#ff8589;border:1px solid #e5484d66}
.b-info{background:#5aa7ff22;color:var(--blue);border:1px solid #5aa7ff66}
.b-mut{background:#93a0c220;color:var(--mut);border:1px solid #93a0c244}
/* forms */
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;background:#0d1226;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:9px 11px;font-size:.9rem;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
.form-inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form-inline .form-row{flex:1;min-width:150px;margin-bottom:0}
/* callouts */
.ok-msg{background:#3ec9a718;border:1px solid #3ec9a755;color:var(--teal);border-radius:8px;padding:10px 12px;font-size:.88rem;margin:10px 0}
.warn-call{background:#f5a52418;border:1px solid #f5a52455;color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.88rem;margin:10px 0}
.err-call{background:#e5484d18;border:1px solid #e5484d55;color:#ff8589;border-radius:8px;padding:10px 12px;font-size:.88rem;margin:10px 0}
.muted{color:var(--mut);font-size:.85rem}
.big{font-size:1.7rem;font-weight:800;color:var(--gold)}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .lbl{color:var(--mut);font-size:.8rem}
.kpi .val{font-size:1.5rem;font-weight:800}
.kpi .val.gold{color:var(--gold)}.kpi .val.teal{color:var(--teal)}.kpi .val.blue{color:var(--blue)}
/* hero */
.hero{background:linear-gradient(135deg,#141d3d,#0d1226 70%);border:1px solid var(--line);border-radius:16px;padding:28px 22px;margin-bottom:16px}
.hero h1{font-size:clamp(1.4rem,4vw,2.1rem);color:var(--gold);margin-bottom:8px}
.hero p{color:var(--mut);max-width:640px}
.price{font-size:1.35rem;font-weight:800;color:var(--teal);margin:6px 0}
.pkg{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.pkg.best{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pkg ul{margin:8px 0 0 18px;color:var(--mut);font-size:.85rem}
/* list */
.nlist{display:flex;flex-direction:column;gap:10px}
.nitem{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;background:var(--card2);padding:10px 12px}
.nitem.unread{border-left-color:var(--gold);background:#f0b64210}
.nitem .ntitle{font-weight:700;font-size:.92rem}
.nitem .nbody{color:var(--mut);font-size:.86rem;margin-top:3px}
.nitem .nmeta{color:var(--mut);font-size:.76rem;margin-top:5px}
/* ticket thread */
.reply{border-left:3px solid var(--blue);margin:8px 0 0 12px;padding:6px 10px;background:var(--card2);border-radius:0 8px 8px 0;font-size:.87rem}
.reply .rm{color:var(--mut);font-size:.76rem}
/* toast */
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.tmsg{background:#0d1226;border:1px solid var(--teal);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:.88rem;box-shadow:0 6px 24px #0009;animation:tin .25s}
.tmsg.err{border-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* misc */
.lock{border:1px dashed var(--err);border-radius:10px;padding:14px;color:#ff8589;background:#e5484d0d}
footer.wrap{color:var(--mut);font-size:.8rem;padding:18px 16px 30px;border-top:1px solid var(--line);margin-top:20px}
canvas.chart{width:100%;height:230px;background:var(--card2);border:1px solid var(--line);border-radius:10px}
.stat-ok{color:var(--teal);font-weight:700}.stat-err{color:#ff8589;font-weight:700}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
/* hamburger + drawer menu (mọi kích thước màn hình — thay dải menu ngang dài) */
.burger{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;min-width:44px;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;flex:none}
.burger span{display:block;width:20px;height:2px;background:var(--gold);border-radius:2px}
.burger:hover{border-color:var(--gold)}
.drawer-mask{position:fixed;inset:0;background:rgba(4,8,20,.62);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(330px,88vw);background:#10152b;border-left:1px solid var(--line);z-index:95;transform:translateX(105%);transition:transform .25s;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 22px;box-shadow:-12px 0 30px rgba(0,0,0,.45)}
body.menu-open{overflow:hidden}
body.menu-open .drawer{transform:none}
body.menu-open .drawer-mask{opacity:1;pointer-events:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.drawer-x{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);font-size:.95rem;padding:4px 10px;cursor:pointer}
.drawer-x:hover{color:var(--gold);border-color:var(--gold)}
.drawer-sec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#161c33;overflow:hidden}
.drawer-sec summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;color:var(--gold);text-transform:uppercase;font-size:.74rem;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;user-select:none}
.drawer-sec summary::-webkit-details-marker{display:none}
.drawer-sec summary:after{content:'▾';font-size:.8rem;color:var(--mut)}
.drawer-sec[open] summary:after{content:'▴'}
.drawer-sec .dgrp{padding:2px 4px 6px}
.drawer .dlink{display:flex;align-items:center;gap:6px;padding:9px 10px;color:var(--tx);border-radius:8px;margin:1px 2px;font-size:.9rem;text-decoration:none}
.drawer .dlink:hover{background:#f0b64218}
.drawer .dlink.on{background:#f0b64222;color:var(--gold);font-weight:700}
.drawer .bdg{display:inline-block;min-width:18px;text-align:center;background:var(--err);color:#fff;border-radius:10px;font-size:.7rem;padding:1px 5px;margin-left:auto}
@media(max-width:640px){
  .topbar .wrap{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .brand{font-size:.82rem;white-space:nowrap;flex:none}
  .brand small{display:none}
  .userchip{padding:3px 8px;font-size:.76rem;max-width:40vw;overflow:hidden;white-space:nowrap;min-width:0}
  .userchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .btn{padding:5px 8px;font-size:.76rem;flex:none;white-space:nowrap}
  .userchip .uc-role,.userchip .uc-bal{display:none}
}
</style>
</head>
<body>
<header class="topbar"><div class="wrap" id="topbar"></div></header>
<div class="drawer-mask" data-act="menu-close"></div>
<aside class="drawer" id="drawer" aria-label="Menu chính"></aside>
<main class="wrap" id="app"></main>
<footer class="wrap">
  <div>Đấu La Đại Lục — Cửa hàng Plugin bản quyền · web v2.0 (24/11/2026) — Cửa hàng + thanh toán QR/thẻ cào/ví</div>
  <div style="margin-top:4px">Web v2.0 — dữ liệu (tài khoản, đơn hàng, ví, Plugin) lưu trên <b>máy chủ dữ liệu</b> (backend Vercel Functions).</div>
</footer>
<div id="toast"></div>
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

/* ================= CORE v2.0: server state + API client + router ================= */
'use strict';
function pad2(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(s){ if(!s) return '—'; const d = new Date(s); if(isNaN(d)) return s; return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); }
function fmtDT(s){ return fmtDate(String(s).slice(0,10)) + (String(s).length>10 ? ' ' + String(s).slice(11,16) : ''); }
function fmtVND(n){ return (n||0).toLocaleString('vi-VN') + 'đ'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysUntil(s){ if(!s) return 9999; return Math.ceil((new Date(s + 'T23:59:59+07:00') - Date.now()) / 864e5); }
function nowStr(){ const d = new Date(Date.now() + 7*3600*1000); return d.toISOString().slice(0,10) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

/* ---------- state từ server ---------- */
const S = { loaded:false, fetchedAt:0, me:null, plugins:[], reviews:[], myOrders:[], myDeposits:[], myPurchases:[], myLicenses:[], myTickets:[], myReferrals:[], myWallet:[], notifications:[], public:{}, admin:null };

async function fetchState(force){
  if(!force && S.loaded && Date.now() - S.fetchedAt < 10000) return;
  /* FIX 24/11/2026 — chống trang trắng: fetch có timeout + tự thử lại 3 lần
     (nguyên nhân gốc: /api/state đôi khi treo do Blob stall — đã fix server-side bằng timeout,
     client vẫn phải tự thủ lại + báo lỗi rõ ràng thay vì treo trắng trang) */
  let lastErr = null;
  for(let i = 0; i < 3; i++){
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 20000) : null;
    try{
      const r = await fetch('/api/state', {credentials:'include', signal: ctl ? ctl.signal : undefined});
      const d = await r.json();
      if(!d.ok) throw new Error(d.msg || 'Không tải được dữ liệu máy chủ');
      Object.assign(S, d);
      S.loaded = true; S.fetchedAt = Date.now();
      showDegradedBanner(d);
      buildNav();
      return;
    }catch(e){
      lastErr = e;
      if(i < 2) await new Promise(res => setTimeout(res, 1200 * (i + 1)));
    }finally{ if(timer) clearTimeout(timer); }
  }
  throw new Error((lastErr && lastErr.message) || 'Không kết nối được máy chủ dữ liệu');
}
function current(){ return S.me; }
/* 26/11/2026 — banner chế độ bảo trì (kho dữ liệu đọc không được → state seed):
   text ĐỘNG theo lý do thật server trả về (degWhy). Bỏ text cũ còn nhắc
   "Blob store tạm khóa theo quota Vercel — tự mở lại 24/12/2026" — đó là
   chữ còn sót từ thời kho Blob; khi driver là Postgres banner phải nói đúng
   nguyên nhân thật, không nói sai sự thật về Blob/quota/ngày mở lại. */
function showDegradedBanner(d){
  const old = document.getElementById('dl-degraded');
  if(old) old.remove();
  if(!d || !d.degraded) return;
  const bar = document.createElement('div');
  bar.id = 'dl-degraded';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#7a2e0e;color:#ffd9b3;font:600 13px/1.4 system-ui;padding:10px 16px;text-align:center;box-shadow:0 -2px 8px rgba(0,0,0,.35)';
  bar.textContent = '⚠ Hệ thống đang BẢO TRÌ kho dữ liệu' + (d.degWhy ? ' — lý do: ' + d.degWhy : '') + '. Bạn vẫn xem được nội dung; đăng nhập / đăng ký / mua hàng tạm thời không khả dụng — quay lại sau hoặc liên hệ admin.';
  document.body.appendChild(bar);
}
function isAdmin(){ return S.me && S.me.role === 'admin'; }
function adminOK(){ return isAdmin() && !!sessionStorage.getItem('DL_ADMIN_TICKET'); }
function unreadCount(){
  if(!S.me) return 0;
  const read = S.me.readNotifs || [];
  return (S.notifications || []).filter(n => !read.includes(n.id)).length;
}

/* ---------- API client ---------- */
async function API(file, body, method){
  const r = await fetch('/api/' + file, {
    method: method || 'POST',
    credentials: 'include',
    headers: {'Content-Type':'application/json', 'x-admin-ticket': sessionStorage.getItem('DL_ADMIN_TICKET') || ''},
    body: method === 'GET' ? undefined : JSON.stringify(body || {})
  });
  let d = {};
  try{ d = await r.json(); }catch(e){ d = {ok:false, msg:'Máy chủ trả về dữ liệu không hợp lệ (' + r.status + ')'}; }
  if(d.auth){ sessionStorage.removeItem('DL_ADMIN_TICKET'); toast(d.msg || 'Phiên đăng nhập đã hết — đăng nhập lại.', true); location.hash = '#/login?next=' + encodeURIComponent(location.hash); throw new Error(d.msg || 'auth'); }
  return d;
}
/* mutation chuẩn: gọi API -> refresh state -> render */
async function mutate(file, body, okMsg){
  const btn = event && event.target ? event.target : null;
  try{
    if(btn && btn.disabled !== undefined){ btn.disabled = true; setTimeout(()=>btn.disabled=false, 4000); }
    const d = await API(file, body);
    if(d.ok){ toast(okMsg || d.msg || '✅ Thành công'); await fetchState(true); render(); }
    else toast(d.msg || '❌ Thao tác thất bại', true);
    return d;
  }catch(e){ return {ok:false, msg:e.message}; }
}

/* ---------- toast ---------- */
function toast(msg, err){
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'tmsg' + (err ? ' err' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ---------- giỏ hàng (localStorage — chỉ dữ liệu chưa thanh toán) ---------- */
const CARTKEY = 'daula_cart_v1';
function cartGet(){ try{ return JSON.parse(localStorage.getItem(CARTKEY) || '[]').filter(x => x && x.pluginId); }catch(e){ return []; } }
function cartSet(items){ localStorage.setItem(CARTKEY, JSON.stringify(items)); buildNav(); }
function cartAdd(pluginId, qty){
  const items = cartGet();
  const ex = items.find(x => x.pluginId === pluginId);
  if(ex) ex.qty = Math.min(10, (ex.qty||1) + (qty||1)); else items.push({pluginId, qty: Math.min(10, Math.max(1, qty||1))});
  cartSet(items);
}
function cartCount(){ return cartGet().reduce((s,x)=>s+(x.qty||1),0); }
function cartPlugin(id){ return (S.plugins||[]).find(p => p.id === id); }

/* ---------- license helpers ---------- */
function licValid(l){ return !l.revoked && (!l.expires || daysUntil(l.expires) >= 0); }
/* 24/11/2026 — cấp độ FREE/VIP: SERVER trả me.level; fallback tính client từ myLicenses */
function myLevel(){
  if(S.me && S.me.level) return S.me.level;
  return (S.myLicenses||[]).some(l => String(l.key||'').startsWith('DL-') && licValid(l)) ? 'vip' : 'free';
}
function myFreeKey(){ return (S.myLicenses||[]).find(l => String(l.key||'').startsWith('DF-') && !l.revoked) || null; }
function myVipKey(){ return (S.myLicenses||[]).filter(l => String(l.key||'').startsWith('DL-') && licValid(l)).sort((a,b)=>(b.days||0)-(a.days||0))[0] || null; }
/* HIỂN THỊ KEY DẠNG ẨN MỘT PHẦN — không in key đầy đủ ra màn hình (chống lộ/chia sẻ key) */
function maskKey(key){
  const segs = String(key || '').split('-');
  if(segs.length < 3) return String(key || '');
  return segs.slice(0, 2).join('-') + '-****-' + segs[segs.length - 1];
}
function licStatus(l){
  if(l.expires && daysUntil(l.expires) < 0) return ['HẾT HẠN','b-err'];
  if(l.expires && daysUntil(l.expires) <= 14) return ['SẮP HẾT HẠN ('+daysUntil(l.expires)+' ngày)','b-warn'];
  return ['HOẠT ĐỘNG','b-ok'];
}

/* ================= QR thật (qrcode-generator MIT, nhúng trực tiếp) ================= */
/* qrcode-lib.js được nối TRƯỚC chunk này khi build: global qrcode(typeNumber, ecc) */
function qrDataURL(text, cell, margin){
  try{
    const qr = qrcode(0, 'M');
    qr.addData(String(text));
    qr.make();
    return qr.createDataURL(cell || 4, margin == null ? 2 : margin);
  }catch(e){
    try{ const qr = qrcode(0, 'L'); qr.addData(String(text).slice(0, 500)); qr.make(); return qr.createDataURL(cell || 4, 2); }catch(e2){ return ''; }
  }
}
function qrImgHTML(payload, size){
  const src = qrDataURL(payload, 4, 2);
  return `<img alt="Mã QR chuyển khoản" src="${src}" style="width:min(${size||232}px,70vw);border-radius:10px;background:#fff">`;
}

/* MỤC 8: tải ảnh đại diện — trình duyệt cắt vuông giữa 256×256 rồi gửi; SERVER kiểm tra lại loại file + kích thước */
ACTIONS['avatar-upload'] = async (d, el) => {
  const card = el.closest('.card');
  const input = card.querySelector('[data-avatarfile]');
  const f = input && input.files && input.files[0];
  if(!f){ toast('Chọn ảnh (PNG/JPG/WebP) trước.', true); return; }
  if(f.size > 2 * 1024 * 1024){ toast('Ảnh vượt 2MB — chọn ảnh nhỏ hơn.', true); return; }
  if(/\.svg$/i.test(f.name) || f.type === 'image/svg+xml'){ toast('KHÔNG nhận SVG — dùng PNG/JPG/WebP.', true); return; }
  try{
    toast('⏳ Đang cắt ảnh 256×256…');
    const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('Ảnh lỗi — không đọc được.')); im.src = dataUrl; });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
    cv.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
    const b64 = cv.toDataURL('image/jpeg', 0.9).split(',')[1];
    toast('⬆ Đang tải ảnh lên server…');
    const r = await API('auth', {act:'avatar-upload', fileB64: b64});
    toast(r.msg || (r.ok ? 'Đã cập nhật ảnh đại diện' : 'Lỗi'), !r.ok);
    if(r.ok){ await fetchState(true); render(); }
  }catch(e){ toast('Lỗi xử lý ảnh: ' + e.message, true); }
};
ACTIONS['avatar-del'] = async () => {
  if(!confirm('Xóa ảnh đại diện — về mặc định?')) return;
  const r = await API('auth', {act:'avatar-del'});
  toast(r.msg || (r.ok ? 'Đã xóa ảnh' : 'Lỗi'), !r.ok);
  if(r.ok){ await fetchState(true); render(); }
};

/* ================= CỬA HÀNG PLUGIN + GIỎ HÀNG + THANH TOÁN ================= */
let SHOP_Q = '', SHOP_CAT = 'all';
function shopCats(){
  const set = {};
  (S.plugins||[]).filter(p=>p.published && !p.licensing && p.kind!=='vip').forEach(p=>{ set[p.category||'Khác'] = (set[p.category||'Khác']||0)+1; });
  return Object.entries(set);
}
function shopFiltered(){
  /* sản phẩm bán theo thời hạn (licensing) hiển thị riêng ở thẻ lớn phía trên — không vào lưới thường */
  let list = (S.plugins||[]).filter(p=>p.published && !p.licensing && p.kind!=='vip');
  if(SHOP_CAT !== 'all') list = list.filter(p=>(p.category||'Khác') === SHOP_CAT);
  const q = SHOP_Q.trim().toLowerCase();
  if(q) list = list.filter(p => (p.name + ' ' + p.description + ' ' + (p.features||[]).join(' ') + ' ' + p.category).toLowerCase().includes(q));
  return list;
}
function plPriceHTML(p){
  const s = p.sale||0;
  const eff = s>0 ? Math.round(p.price*(100-s)/100) : p.price;
  if(!p.price) return '<span class="badge b-ok">Miễn phí</span>';
  return (s>0 ? `<span class="muted" style="text-decoration:line-through">${fmtVND(p.price)}</span> ` : '') + `<b style="color:#f0b642">${fmtVND(eff)}</b>` + (s>0?` <span class="badge b-err">−${s}%</span>`:'');
}
function plRating(id){
  const rs = (S.reviews||[]).filter(r=>r.pluginId===id && r.status==='visible');
  if(!rs.length) return null;
  const avg = rs.reduce((s,r)=>s+r.rating,0)/rs.length;
  return {avg: avg.toFixed(1), n: rs.length, stars: '★'.repeat(Math.round(avg)) + '☆'.repeat(5-Math.round(avg))};
}
function cartInCart(id){ return cartGet().some(x=>x.pluginId===id); }
/* đơn giá 1 dòng giỏ hàng — biết cả dòng mua theo MỐC THỜI HẠN (giá từ licenseTiers) */
function cartUnit(c){
  const p = cartPlugin(c.pluginId);
  if(!p) return 0;
  if(p.licensing && c.tierId){
    const t = tierById(c.tierId) || {};
    if(!t.price) return 0;
    return Math.round(t.price * (100 - (t.sale||0)) / 100);
  }
  return (p.sale||0) > 0 ? Math.round(p.price*(100-p.sale)/100) : p.price;
}
function cartLineName(c){
  const p = cartPlugin(c.pluginId) || {};
  if(p.licensing && c.tierId){ const t = tierById(c.tierId); return p.name + (t ? ' (' + tierLabel(t) + ')' : ''); }
  return p.name || c.pluginId;
}

ROUTES['#/shop'] = { title:'Cửa hàng Plugin', html(){
  const cats = shopCats();
  const list = shopFiltered();
  const main = mainPlugin();
  const tiers = getTiers();
  const hasLic = current() && (S.myLicenses||[]).some(licValid);
  return `

ACTIONS['cart-inc'] = (d) => { const it = cartGet(); const x = it.find(y=>y.pluginId===d.id); if(x) x.qty = Math.min(10,(x.qty||1)+1); cartSet(it); render(); };
ACTIONS['cart-dec'] = (d) => { let it = cartGet(); const x = it.find(y=>y.pluginId===d.id); if(x){ x.qty--; if(x.qty<=0) it = it.filter(y=>y.pluginId!==d.id); } cartSet(it); render(); };

ACTIONS['place-order'] = async (d, el) => {
  const items = cartGet();
  if(!items.length){ toast('Giỏ trống.', true); return; }
  const coupon = ((document.getElementById('co-coupon')||{}).value||'').trim();
  const r = await API('orders', {act:'create', items, coupon, method: d.method});
  if(!r.ok){ toast(r.msg, true); return; }
  localStorage.removeItem('daula_coupon');
  await fetchState(true);
  if(r.paid){
    cartSet([]);
    const granted = (r.purchased || []).find(p => p.key);
    if(granted && granted.key){
      /* key đầy đủ chỉ hiển thị ĐÚNG 1 LẦN ngay sau khi mua (tự ẩn — sau đó chỉ hiện dạng mask + tra cứu) */
      sessionStorage.setItem('DL_REVEAL_KEY', JSON.stringify({key: granted.key, label: granted.label || granted.name || ''}));
      toast('✅ Đơn ' + r.order.id + ' đã thanh toán bằng ví — lưu license key ở trang Kho đã mua!');
    } else toast('✅ Đơn ' + r.order.id + ' đã thanh toán bằng ví — Plugin vào Kho đã mua!');
    /* hashchange tự render — chỉ render tay nếu đã đứng đúng trang, tránh render 2 lần làm mất thẻ key 1-lần */
    if(location.hash === '#/u/downloads'){ render(); } else { location.hash = '#/u/downloads'; }
    return;
  }
  if(d.method === 'card'){
    /* đơn qua thẻ: tạo luôn yêu cầu nạp thẻ giá trị đơn gắn orderId */
    cartSet([]);
    sessionStorage.setItem('daula_pay_order', r.order.id);
    toast('Đơn ' + r.order.id + ' đã tạo — chọn thẻ cào và nhập thẻ để thanh toán.');
    location.hash = '#/pay/' + r.order.id; render(); return;
  }
  cartSet([]);
  toast('Đơn ' + r.order.id + ' đã tạo — quét QR để thanh toán.');
  location.hash = '#/pay/' + r.order.id; render();
};

const CARRIERS = ['Viettel','Mobifone','Vinaphone','Vietnamobile','Zing','Gate','Garena','VTC','Bit'];
const DENOMS = [10000,20000,50000,100000,200000,500000];
function topupRate(carrier){
  const r = (S.public && S.public.topupRates) || {global:20, carriers:{}};
  const ov = (r.carriers||{})[String(carrier).toLowerCase()];
  return (ov === 0 || ov) ? ov : r.global;
}
function topupCredit(denom, rate){ return Math.round(denom * (100 - rate) / 100); }
function u12BreakHTML(carrier, denom){
  const rate = topupRate(carrier), credit = topupCredit(denom, rate);
  return `<table class="tbl" style="min-width:0"><tbody>
    <tr><td>Mệnh giá gốc của thẻ</td><td><b>${fmtVND(denom)}</b></td></tr>
    <tr><td>Chiết khấu nạp thẻ ${esc(carrier)}</td><td><span class="stat-err">−${rate}% = −${fmtVND(denom - credit)}</span></td></tr>
    <tr><td><b>Số tiền THỰC NHẬN vào ví</b></td><td><b class="stat-ok" style="font-size:1.15rem">+${fmtVND(credit)}</b></td></tr>
  </tbody></table>`;
}
/* client tự dựng payload Napas (cùng thuật toán server — hiển thị QR không cần chờ mạng) */
function O_napasQRClient(bank, amount, content){
  function tlv(id, val){ const v = String(val); return id + String(v.length).padStart(2,'0') + v; }
  function crc16(p){ let crc = 0xFFFF; for(let i=0;i<p.length;i++){ crc ^= p.charCodeAt(i)<<8; for(let b=0;b<8;b++){ crc = (crc & 0x8000) ? ((crc<<1)^0x1021) : (crc<<1); crc &= 0xFFFF; } } return crc.toString(16).toUpperCase().padStart(4,'0'); }
  const bin = String(bank.bin||'').replace(/\D/g,'').slice(0,6), acc = String(bank.account||'').replace(/\D/g,'');
  const merchant = tlv('00','A000000727') + tlv('01',(bin+acc).slice(0,25)) + tlv('02','QRIBFTTA');
  let p = tlv('00','01') + tlv('01','11') + tlv('38',merchant) + tlv('53','703') + (amount>0?tlv('54',String(Math.round(amount))):'') + tlv('58','VN') + tlv('62',tlv('08',String(content||'').slice(0,25)));
  return p + '6304' + crc16(p + '6304');
}
ROUTES['#/pay'] = { title:'Thanh toán đơn', user:true, html(){ return payOrder(); }, after(){ afterPayPage(); }};
function afterPayPage(){
  renderPayPage();
  window.__payTimer && clearInterval(window.__payTimer);
  /* poll trạng thái 15s/lần khi đang ở trang thanh toán */
  window.__payTimer = setInterval(async () => {
    if(!(location.hash||'').startsWith('#/pay/')){ clearInterval(window.__payTimer); return; }
    try{ await fetchState(true); if((location.hash||'').startsWith('#/pay/')) render(); }catch(e){}
  }, 15000);
  document.querySelectorAll('input[name="carrier"]').forEach(r=>r.addEventListener('change', updPayBreak));
  const den = document.querySelector('#pay-card select[name="denom"]');
  if(den) den.addEventListener('change', updPayBreak);
  function updPayBreak(){
    const carrier = (document.querySelector('input[name="carrier"]:checked')||{}).value || 'Viettel';
    const denom = +(document.querySelector('#pay-card select[name="denom"]')||{}).value || 100000;
    const box = document.getElementById('paybreak');
    if(box) box.innerHTML = u12BreakHTML(carrier, denom);
    document.querySelectorAll('[data-carrierchip]').forEach(el=>{
      el.classList.toggle('b-info', el.dataset.carrierchip === carrier);
      el.classList.toggle('b-mut', el.dataset.carrierchip !== carrier);
    });
  }
}

ACTIONS['w-create-qr'] = async (d) => {
  const amt = +((document.getElementById('w-amt')||{}).value || 0);
  const r = await API('deposits', {act:'bank', amount: amt});
  if(r.ok){ W_QR = {id: r.deposit.id, amount: r.deposit.amount, content: r.deposit.paymentContent, qrPayload: r.qrPayload, status: r.deposit.status}; toast('Đã tạo yêu cầu nạp ' + r.deposit.id + ' — quét QR hoặc chuyển đúng nội dung.'); render(); }
  else toast(r.msg, true);
};
ACTIONS['w-claim'] = async (d) => {
  const r = await mutate('deposits', {act:'claim', id: d.id}, 'Đã ghi nhận chuyển khoản — chờ server xác minh.');
  if(r.ok && W_QR && W_QR.id === d.id) W_QR.status = 'Chờ xác nhận';
};
ACTIONS['w-check'] = async (d) => {
  const r = await API('deposits', {act:'check', id: d.id});
  const box = document.getElementById('wcheck');
  if(box && r.ok) box.innerHTML = `<div class="ok-msg" style="margin-top:8px">Trạng thái yêu cầu ${esc(d.id)}: <b>${esc(r.status)}</b>${r.status==='Thành công'?' — tiền đã vào ví!':''}</div>`;
  if(r.ok && r.status !== 'Chờ chuyển khoản'){ await fetchState(true); }
  else if(r.ok) toast('Trạng thái: ' + r.status);
};
FORMS['w12-card'] = async (d) => {
  const carrier = (document.querySelector('input[name="w12carrier"]:checked')||{}).value || 'Viettel';
  const r = await API('deposits', {act:'card', carrier, denom: +d.denom, serial: d.serial, pin: d.pin});
  const box = document.getElementById('w12result');
  if(r.ok && r.status === 'success'){
    toast('✅ ' + r.msg);
    if(box) box.innerHTML = `<div class="ok-msg">✅ <b>Nạp thành công!</b> Thực nhận <b>+${fmtVND(r.deposit.credit)}</b> — số dư mới <b>${fmtVND(r.balanceAfter)}</b> · mã GD <span class="code">${esc(r.deposit.id)}</span></div>`;
    await fetchState(true);
  } else if(r.ok){
    toast(r.msg || 'Đã gửi thẻ — chờ xác minh.');
    if(box) box.innerHTML = `<div class="ok-msg">⏳ Thẻ đã vào hệ thống (mã <span class="code">${esc((r.deposit||{}).id||'')}</span>) — ${esc(r.msg||'cổng/admin sẽ xác minh')} — chỉ cộng tiền khi xác nhận thành công.</div>`;
    await fetchState(true);
  } else {
    toast(r.msg || 'Thẻ không hợp lệ.', true);
    if(box) box.innerHTML = `<div class="err-call">${esc(r.msg||'Thẻ không hợp lệ — kiểm tra serial/PIN.')}</div>`;
  }
};

ROUTES['#/a/export'] = { title:'Xuất dữ liệu', admin:true, html(){
  return `
  <h1 class="pagetitle">📥 Xuất dữ liệu (Excel/CSV)<span class="tagchip">từ máy chủ dữ liệu</span></h1>
  <div class="subtitle">CSV chuẩn UTF-8 có BOM — mở trực tiếp bằng Excel.</div>
  <div class="card"><div class="pill-row">
    <button class="btn btn-p" data-act="a7-export" data-what="users">⬇ Người dùng (.csv)</button>
    <button class="btn btn-p" data-act="a7-export" data-what="orders">⬇ Đơn hàng (.csv)</button>
    <button class="btn btn-p" data-act="a7-export" data-what="deposits">⬇ Nạp tiền (.csv)</button>
    <button class="btn btn-p" data-act="a7-export" data-what="plugins">⬇ Sản phẩm (.csv)</button>
  </div>
  <div id="a7prev"></div>
  </div>`;
}};
ACTIONS['a7-export'] = d => {
  const A = S.admin || {};
  const VNLBL = {users:'Người dùng', orders:'Đơn hàng', deposits:'Nạp tiền', plugins:'Sản phẩm'};
  let head, rows;
  if(d.what==='users'){
    head = ['username','email','role','points','balance','banned','created_at'];
    rows = (A.users||[]).map(u=>[u.username,u.email,u.role,u.points||0,u.balance||0,u.banned?'yes':'no',u.createdAt]);
  } else if(d.what==='orders'){
    head = ['id','user','items','subtotal','discount','total','method','status','date','license'];
    const um = {}; (A.users||[]).forEach(u=>um[u.id]=u.username);
    rows = (A.allOrders||[]).map(o=>[o.id, um[o.userId]||'', (o.items||[]).map(i=>i.name+' x'+i.qty).join(' | '), o.subtotal, o.discount, o.total, o.method, o.status, o.date, o.license]);
  } else if(d.what==='deposits'){
    head = ['id','user','kind','carrier','denom','rate','credit','status','gateway','serial','at','balance_after'];
    rows = (A.allDeposits||[]).map(x=>[x.id, x.user, x.kind, x.carrier||'', x.amount||x.denom||0, x.rate||0, x.credit, x.status, x.gateway||'', x.serial||'', x.at||x.createdAt||'', x.balanceAfter||'']);
  } else {
    head = ['id','name','category','kind','version','price','sale','published','file','created'];
    rows = (S.plugins||[]).map(p=>[p.id, p.name, p.category, p.kind, p.version, p.price, p.sale||0, p.published?'yes':'no', p.hasFile?p.fileName||'yes':'no', p.createdAt||'']);
  }
  const csv = '\ufeff' + [head.join(','), ...rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(','))].join('\n');
  downloadFile(d.what + '.csv', csv, 'text/csv;charset=utf-8');
  document.getElementById('a7prev').innerHTML = `<h4>Xem trước ${esc(VNLBL[d.what]||d.what)}.csv (${rows.length} dòng)</h4>
  <div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
  <tbody>${rows.slice(0,5).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  toast('Đã xuất ' + (VNLBL[d.what]||d.what) + '.csv (' + rows.length + ' dòng)');
};

/* upload jar: file ≤3,2MB gửi 1 request; file lớn cắt phần 3MB gửi jar-part rồi jar-done — server ghép + kiểm tra + SHA-256 */
async function uploadJarFile(pkg, box){
  try{
    const f = (box.querySelector('[data-jarfile]')||{}).files ? box.querySelector('[data-jarfile]').files[0] : null;
    const ver = (box.querySelector('[name=jarver]')||{}).value || '';
    const note = (box.querySelector('[name=jarnote]')||{}).value || '';
    if(!f){ toast('Chọn file .jar trước.', true); return; }
    if(!/\.jar$/i.test(f.name)){ toast('Chỉ nhận file .jar.', true); return; }
    if(!ver.trim()){ toast('BẮT BUỘC nhập số phiên bản (VD: 3.16.9).', true); return; }
    if(f.size > 80 * 1024 * 1024){ toast('File vượt 80MB.', true); return; }
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(f); });
    if(f.size <= 3.2 * 1024 * 1024){
      toast('⬆ Đang tải lên ' + f.name + ' — v' + ver + '…');
      const r = await API('admin', {act:'jar-upload', pkg, version: ver.trim(), changelog: note, fileName: f.name, fileB64: b64});
      toast(r.msg || (r.ok ? 'Đã tải lên' : 'Lỗi'), !r.ok);
      if(r.ok){ await fetchState(true); render(); }
      return;
    }
    const uid = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
    const CHUNK = 3 * 1024 * 1024;
    const parts = Math.ceil(f.size / CHUNK);
    let done = false;
    for(let i = 0; i < parts; i++){
      toast('⬆ Đang gửi phần ' + (i+1) + '/' + parts + ' — ' + f.name + ' (v' + ver + ')…');
      const pr = await API('admin', {act:'jar-part', uid, idx: i, data: b64.slice(i * CHUNK * 4 / 3, (i + 1) * CHUNK * 4 / 3)});
      if(!pr.ok) throw new Error(pr.msg || 'Phần ' + i + ' lỗi');
    }
    const r = await API('admin', {act:'jar-done', uid, parts, pkg, version: ver.trim(), changelog: note, fileName: f.name});
    toast(r.msg || (r.ok ? 'Đã tải lên' : 'Lỗi'), !r.ok);
    done = r.ok;
    if(done){ await fetchState(true); render(); }
  }catch(e){ toast('Upload lỗi: ' + e.message, true); }
}
ACTIONS['jar-upload'] = (d, el) => uploadJarFile(d.pkg, el.closest('[data-jarup]'));

/* ================= CHARTS + BOOT ================= */
function chartLine(cv, labels, data, color, money){
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 600, H = 230;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const pad = {l:56, r:14, t:16, b:26};
  const max = Math.max(...data, 1) * 1.15 || 1;
  g.clearRect(0,0,W,H);
  g.strokeStyle = '#2a3555'; g.fillStyle = '#93a0c2'; g.font = '10px system-ui';
  for(let i=0;i<=4;i++){
    const y = pad.t + (H-pad.t-pad.b)*i/4;
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W-pad.r, y); g.stroke();
    g.fillText(money ? Math.round(max*(4-i)/1000)+'k' : Math.round(max*(4-i)), 6, y+3);
  }
  const n = data.length;
  const px = i => pad.l + (W-pad.l-pad.r) * (n===1?0.5:i/(n-1));
  const py = v => H-pad.b - (H-pad.t-pad.b) * v/max;
  g.beginPath();
  data.forEach((v,i)=> i ? g.lineTo(px(i), py(v)) : g.moveTo(px(i), py(v)));
  g.strokeStyle = color; g.lineWidth = 2; g.stroke();
  g.lineTo(px(n-1), H-pad.b); g.lineTo(px(0), H-pad.b); g.closePath();
  g.fillStyle = color+'22'; g.fill();
  data.forEach((v,i)=>{ g.beginPath(); g.arc(px(i), py(v), 3, 0, 7); g.fillStyle = color; g.fill(); });
  g.fillStyle = '#93a0c2';
  const step = Math.ceil(n/7);
  labels.forEach((lb,i)=>{ if(i%step===0) g.fillText(String(lb).slice(5), px(i)-12, H-8); });
}
function chartBar(cv, labels, data, color, money){
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 600, H = 230;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const pad = {l:56, r:14, t:16, b:30};
  const max = Math.max(...data, 1) * 1.15;
  g.clearRect(0,0,W,H);
  g.strokeStyle = '#2a3555'; g.fillStyle = '#93a0c2'; g.font = '10px system-ui';
  for(let i=0;i<=4;i++){
    const y = pad.t + (H-pad.t-pad.b)*i/4;
    g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W-pad.r, y); g.stroke();
    g.fillText(money ? Math.round(max*(4-i)/1000)+'k' : Math.round(max*(4-i)), 6, y+3);
  }
  const n = data.length, bw = (W-pad.l-pad.r)/n*0.55;
  data.forEach((v,i)=>{
    const x = pad.l + (W-pad.l-pad.r)*(i+0.5)/n - bw/2;
    const y = H-pad.b - (H-pad.t-pad.b)*v/max;
    g.fillStyle = color;
    g.fillRect(x, y, bw, H-pad.b-y);
    g.fillStyle = '#e8ecf8';
    g.fillText(money ? Math.round(v/1000)+'k' : String(v), x + bw/2 - 10, y-4);
    g.fillStyle = '#93a0c2';
    const lb = labels[i] || '';
    g.fillText(lb.length>10 ? lb.slice(0,10) : lb, x + bw/2 - lb.length*2.6, H-10);
  });
}

/* ---------- boot ---------- */
window.addEventListener('hashchange', render);
/* --- Responsive bảng: gán nhãn cột từ <thead> vào từng <td> (data-label) — CSS biến dòng bảng thành thẻ dọc trên điện thoại (30/11) --- */
function tagTblLabels(root){
  (root || document).querySelectorAll('table.tbl').forEach(t => {
    const ths = Array.from(t.querySelectorAll('thead th'));
    if(!ths.length) return;
    t.classList.add('tbl-cards');
    t.querySelectorAll('tbody tr').forEach(tr => {
      const tds = Array.from(tr.children).filter(c => c.tagName === 'TD');
      if(tds.length !== ths.length) return;
      tds.forEach((td, i) => {
        const lbl = ths[i].textContent.trim();
        if(lbl) td.setAttribute('data-label', lbl);
      });
    });
  });
}
let _tagTblPending = false;
new MutationObserver(() => {
  if(_tagTblPending) return;
  _tagTblPending = true;
  requestAnimationFrame(() => { _tagTblPending = false; tagTblLabels(); });
}).observe(document.body, {childList:true, subtree:true});

(async () => {
  try{ await render(); }
  catch(e){
    document.getElementById('app').innerHTML = `<div class="err-call">Lỗi khởi động: ${esc(e.message)}<br><button class="btn" onclick="location.reload()">Tải lại trang</button></div>`;
  }
})();
